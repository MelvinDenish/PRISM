<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/prism-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PRISM — Placement Resources & Interview Skill Manager. Mentorship, mock interviews, coding practice, and curated prep resources." />
    <meta name="theme-color" content="#0E0E11" />
    <title>PRISM — Placement & Interview Prep</title>
    <script>
      // Set theme before paint to avoid flash of wrong theme. Dark-first:
      // default to dark on first visit; a saved preference still wins.
      (function () {
        try {
          var saved = localStorage.getItem('prism_theme');
          document.documentElement.dataset.theme = saved || 'dark';
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
        // P5: apply the cached per-user accent palette before paint (mirrors
        // src/utils/theme.js). Keeps colours from flashing the default brand.
        try {
          var t = JSON.parse(localStorage.getItem('prism_user_theme') || 'null');
          if (t && t.accentPrimary) {
            var root = document.documentElement;
            var m = {
              accentPrimary: '--accent-primary', accentPrimaryStrong: '--accent-primary-strong',
              accentSecondary: '--accent-secondary', accentAction: '--accent-action',
              accentActionStrong: '--accent-action-strong', gradientPrimary: '--gradient-primary'
            };
            for (var k in m) { if (t[k]) root.style.setProperty(m[k], t[k]); }
            root.style.setProperty('--accent-success', t.accentPrimary);
            root.style.setProperty('--accent-info', t.accentSecondary);
            root.style.setProperty('--gradient-success', t.gradientPrimary);
            root.style.setProperty('--gradient-secondary', t.gradientPrimary);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
