name: CI/CD

# CI runs on every PR and push. CD (deploy job) runs only on push to main,
# and only after both CI jobs pass — so a green main always auto-deploys to the
# Lightsail box. Manual re-deploy: Actions → CI/CD → Run workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    name: server — auth integration test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/prism_ci
      JWT_SECRET: ci-test-secret-min-16-chars-0123456789abcdef
      CLIENT_URL: http://localhost:5173
      PORT: 5000
      # The smoke test never generates a PDF, so skip Puppeteer's Chromium download.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: deploy to Lightsail
    needs: [client, server]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (pull main, write env from secrets, compose up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            REPO=https://github.com/MelvinDenish/PRISM.git
            if [ ! -d "$HOME/prism/.git" ]; then git clone "$REPO" "$HOME/prism"; fi
            cd "$HOME/prism"
            git fetch --depth=1 origin main
            git reset --hard origin/main
            cat > server/.env <<'PRISM_ENV_EOF'
            ${{ secrets.SERVER_ENV }}
            PRISM_ENV_EOF
            cat > deploy/.env <<'PRISM_DEPLOY_EOF'
            ${{ secrets.DEPLOY_ENV }}
            PRISM_DEPLOY_EOF
            cd deploy
            docker compose -f docker-compose.deploy.yml up -d --build
            docker image prune -f

  verify:
    name: verify deploy (public health check)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Poll HTTPS health endpoint
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.BACKEND_DOMAIN || 'prism-project.duckdns.org' }}/api/health"; then
              echo; echo "deploy healthy"; exit 0
            fi
            echo "waiting for backend... ($i)"; sleep 6
          done
          echo "backend health check failed after deploy"; exit 1
