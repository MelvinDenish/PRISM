# Self-hosted LiveKit SFU for PRISM live video.
#
#   docker compose -f deploy/docker-compose.livekit.yml up -d
#
# Then set in server/.env (key/secret must match deploy/livekit.yaml):
#   LIVEKIT_WS_URL=ws://localhost:7880
#   LIVEKIT_API_KEY=devkey
#   LIVEKIT_API_SECRET=devsecret_change_me_to_a_long_random_string
#
# Ports: 7880 signaling (WS), 7881 TCP media fallback, 3478/udp TURN,
#        50000-50100/udp media. See docs/LIVEKIT.md for production/TLS.
services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
