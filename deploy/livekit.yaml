# LiveKit server config (self-hosted SFU). Reference: https://docs.livekit.io/home/self-hosting/
#
# DEV-ONLY KEYS BELOW. Generate your own for anything shared/public:
#   docker run --rm livekit/livekit-server generate-keys
# The key/secret pair here MUST match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in server/.env.

port: 7880          # HTTP/WebSocket signaling (client connects here → LIVEKIT_WS_URL)
bind_addresses:
  - ""             # listen on all interfaces inside the container

rtc:
  # UDP port range for media (WebRTC). These must be published by the container
  # and open in any firewall. Kept small for a single-node dev box.
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881    # fallback when UDP is blocked
  use_external_ip: false
  # ICE candidate IP the SFU advertises to browsers. Inside Docker the container's
  # own IP (e.g. 172.x) is unreachable from a host browser, so media (the WebRTC
  # peer connection) never forms. For LOCAL Docker dev, advertise the loopback the
  # host reaches via the published UDP ports. In PRODUCTION, remove node_ip and set
  # use_external_ip: true (or node_ip: <public IP>) so remote peers get a routable
  # candidate.
  node_ip: 127.0.0.1

# API key → secret. Generate real ones for production (see comment above).
keys:
  devkey: devsecret_change_me_to_a_long_random_string

# Embedded TURN — lets users behind strict/symmetric NAT connect without an
# external coturn. For production, enable TLS (domain + cert) and open 5349/443.
turn:
  enabled: true
  udp_port: 3478
  # tls_port: 5349
  # domain: livekit.yourdomain.com

logging:
  level: info
